name: Research Worker (isolated acceptance)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded research operation (uses configured isolated URL)
        type: choice
        options: [drain, validate, publish]
        default: validate
        required: true
permissions:
  contents: read
concurrency:
  group: research-worker-acceptance
  cancel-in-progress: false
jobs:
  worker:
    if: vars.CSR_RESEARCH_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke bounded worker
        env:
          WORKER_URL: ${{ vars.CSR_RESEARCH_WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.CSR_WORKER_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test -n "$WORKER_TOKEN"
          case "$WORKER_URL" in https://*) ;; *) echo "Configure an HTTPS research worker URL"; exit 1;; esac
          case "$OPERATION" in drain|validate|publish) ;; *) exit 1;; esac
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "Authorization: Bearer $WORKER_TOKEN" \
            "${WORKER_URL%/}/api/research?operation=$OPERATION"
