name: Radar Scheduler

on:
  # Automatic execution is owned by Upstash QStash; retain manual recovery.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-state-radar-hourly-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate scan token
        env:
          CSR_SCAN_TOKEN: ${{ secrets.CSR_SCAN_TOKEN }}
        run: |
          if [ -z "$CSR_SCAN_TOKEN" ]; then
            echo "CSR_SCAN_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Trigger Vercel Singapore market scan
        env:
          CSR_SCAN_TOKEN: ${{ secrets.CSR_SCAN_TOKEN }}
          TRIGGER_KIND: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 300 \
            -H "X-Radar-Trigger: $TRIGGER_KIND" \
            -H "X-Radar-Run-Id: $WORKFLOW_RUN_ID" \
            -H "Authorization: Bearer $CSR_SCAN_TOKEN" \
            https://crypto-state-radar.vercel.app/api/scan
